server:
  port: 8080
spring:
  application:
    name: findoc-agent
  datasource:
    url: jdbc:postgresql://localhost:5432/findoc
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:swamys123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.findoc.messaging
        spring.json.value.default.type: com.findoc.messaging.IngestionJob
    listener:
      ack-mode: record
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
jwt:
  secret: ${JWT_SECRET:local-dev-secret-at-least-32-characters-long}
  expiry-seconds: 3600
agent:
  max-iterations: 5
  top-k: 5
gemini:
  api-key: ${GEMINI_API_KEY:}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  model: ${OPENROUTER_MODEL:mistralai/mistral-7b-instruct:free}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai}
findoc:
  ingestion:
    topic: ${FINDOC_INGESTION_TOPIC:findoc.ingestion}
    group: ${FINDOC_INGESTION_GROUP:findoc-ingestion}
    dlq: ${FINDOC_INGESTION_DLQ:findoc.ingestion.dlq}
management:
  endpoints.web.exposure.include: health,info
