server:
  port: 8080
spring:
  application:
    name: findoc-agent
  datasource:
    url: jdbc:postgresql://localhost:5432/findoc
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
jwt:
  secret: ${JWT_SECRET:local-dev-secret-at-least-32-characters-long}
  expiry-seconds: 3600
agent:
  max-iterations: 5
  top-k: 5
gemini:
  api-key: ${GEMINI_API_KEY:}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
management:
  endpoints.web.exposure.include: health,info
