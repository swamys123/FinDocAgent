spring:
  main:
    web-application-type: servlet
  datasource:
    url: jdbc:h2:mem:findoc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  liquibase:
    enabled: false
jwt:
  secret: test-secret-at-least-32-characters-long
  expiry-seconds: 3600
