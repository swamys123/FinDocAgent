plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.12'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.findoc'
version = '1.0.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

def dotenvFile = file('.env')
def dotenvValues = [:]

if (dotenvFile.isFile()) {
    dotenvFile.eachLine { line ->
        def entry = line.trim()
        if (entry && !entry.startsWith('#')) {
            def separator = entry.indexOf('=')
            if (separator > 0) {
                def key = entry.substring(0, separator).trim()
                def value = entry.substring(separator + 1).trim()
                if (key.matches('[A-Za-z_][A-Za-z0-9_]*')) {
                    if ((value.startsWith('\"') && value.endsWith('\"')) ||
                        (value.startsWith("'") && value.endsWith("'"))) {
                        value = value.substring(1, value.length() - 1)
                    }
                    dotenvValues[key] = value
                }
            }
        }
    }
}

def localEnvironment = dotenvValues + System.getenv()

tasks.withType(JavaExec).configureEach {
    environment localEnvironment
}

tasks.withType(Test).configureEach {
    environment localEnvironment
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.postgresql:postgresql'
    implementation 'org.hibernate.orm:hibernate-vector:6.4.10.Final'
    implementation 'com.pgvector:pgvector:0.1.6'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
    testRuntimeOnly 'com.h2database:h2'
}

bootRun{
    jvmArgs = ['-Xms64m', '-Xmx256m','-XX:+UseSerialGC']    
}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/*IntegrationTest.class'
}

tasks.register('integrationTest', Test) {
    description = 'Runs the PostgreSQL/Kafka integration tests.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/integration/**'
}
