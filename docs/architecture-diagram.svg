<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">FinDocAgent architecture</title>
  <desc id="desc">A tenant-aware document intelligence system with a React client, Spring Boot API, Kafka ingestion, PostgreSQL and pgvector, Gemini embeddings, and OpenRouter generation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#415466"/>
    </marker>
    <style>
      .title { font: 700 26px sans-serif; fill: #172b3a; }
      .label { font: 700 16px sans-serif; fill: #172b3a; }
      .text { font: 14px sans-serif; fill: #304858; }
      .small { font: 12px sans-serif; fill: #526977; }
      .box { stroke: #415466; stroke-width: 2; rx: 12; }
      .arrow { stroke: #415466; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f7f4ee"/>
  <text x="60" y="58" class="title">FinDocAgent architecture</text>
  <text x="60" y="84" class="text">Tenant-aware document ingestion, retrieval, and grounded generation</text>

  <rect x="60" y="140" width="190" height="150" class="box" fill="#dceee9"/>
  <text x="82" y="176" class="label">React frontend</text>
  <text x="82" y="205" class="text">Login and JWT session</text>
  <text x="82" y="228" class="text">Document upload/status</text>
  <text x="82" y="251" class="text">Grounded query UI</text>

  <rect x="330" y="115" width="280" height="210" class="box" fill="#e6e1f2"/>
  <text x="355" y="151" class="label">Spring Boot API</text>
  <text x="355" y="180" class="text">JWT + tenant boundary</text>
  <text x="355" y="203" class="text">Document and agent controllers</text>
  <text x="355" y="226" class="text">Bounded agent orchestration</text>
  <text x="355" y="249" class="text">Citations, sessions, traces</text>
  <text x="355" y="287" class="small">RestClient provider adapters</text>

  <rect x="700" y="115" width="190" height="125" class="box" fill="#f7dfc6"/>
  <text x="725" y="151" class="label">Kafka</text>
  <text x="725" y="180" class="text">Ingestion topic</text>
  <text x="725" y="203" class="text">Retry and DLQ path</text>

  <rect x="700" y="300" width="190" height="170" class="box" fill="#d9e8f4"/>
  <text x="725" y="336" class="label">PostgreSQL</text>
  <text x="725" y="365" class="text">Tenant-scoped documents</text>
  <text x="725" y="388" class="text">Chunks and audit traces</text>
  <text x="725" y="411" class="text">pgvector cosine search</text>
  <text x="725" y="447" class="small">Liquibase schema and seed data</text>

  <rect x="980" y="115" width="160" height="125" class="box" fill="#f4e3b2"/>
  <text x="1005" y="151" class="label">Gemini</text>
  <text x="1005" y="180" class="text">Embeddings</text>
  <text x="1005" y="203" class="text">768-dim vectors</text>

  <rect x="980" y="300" width="160" height="125" class="box" fill="#f4e3b2"/>
  <text x="1005" y="336" class="label">OpenRouter</text>
  <text x="1005" y="365" class="text">Generation</text>
  <text x="1005" y="388" class="text">Comparison fallback</text>

  <rect x="330" y="430" width="280" height="145" class="box" fill="#e8eee4"/>
  <text x="355" y="466" class="label">Async ingestion worker</text>
  <text x="355" y="495" class="text">PDF/text extraction</text>
  <text x="355" y="518" class="text">Chunking and page metadata</text>
  <text x="355" y="541" class="text">Embedding and persistence</text>

  <path d="M250 215 H330" class="arrow"/>
  <path d="M610 185 H700" class="arrow"/>
  <path d="M610 260 H700 V350" class="arrow"/>
  <path d="M795 240 V300" class="arrow"/>
  <path d="M890 177 H980" class="arrow"/>
  <path d="M890 385 H980" class="arrow"/>
  <path d="M470 325 V430" class="arrow"/>
  <path d="M610 502 H700 V420" class="arrow"/>
  <path d="M890 350 H940 V240 H980" class="arrow dashed"/>

  <text x="638" y="173" class="small">upload event</text>
  <text x="620" y="278" class="small">query + tenant filters</text>
  <text x="902" y="168" class="small">embed</text>
  <text x="902" y="376" class="small">generate</text>
  <text x="480" y="382" class="small">consume</text>

  <rect x="60" y="650" width="1080" height="52" rx="10" fill="#172b3a"/>
  <text x="85" y="682" font-family="sans-serif" font-size="14" fill="#ffffff">Security and reliability cross-cut the flow: tenant predicates, JWT claims, trace context, retries, circuit breakers, and validation.</text>
</svg>